name: Build CopyMody

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          brew install ldid
          # Additional tools if needed for RootHide scheme

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make package

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopyMody-deb
          path: packages/*.deb
          if-no-files-found: warn
